<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Dinosaurio</title>
<style>
  :root { --bg: #f7f7f7; --fg: #535353; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Courier New", monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    transition: background .8s, color .8s;
  }
  body.night { --bg: #202124; --fg: #acacac; }
  #wrap { width: 100%; max-width: 800px; padding: 0 16px; }
  canvas {
    display: block; width: 100%; image-rendering: pixelated;
    transition: filter .8s;
  }
  canvas.night { filter: invert(1) hue-rotate(180deg); }
  p { font-size: 13px; text-align: center; opacity: .8; margin-top: 18px; line-height: 1.6; }
  kbd { border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="600" height="150"></canvas>
  <p>
    <kbd>Espacio</kbd> / <kbd>↑</kbd> saltar &nbsp;·&nbsp; <kbd>↓</kbd> agacharse &nbsp;·&nbsp; <kbd>P</kbd> pausa &nbsp;·&nbsp; <kbd>M</kbd> sonido<br>
    En móvil: toca la mitad superior para saltar y la inferior para agacharte.
  </p>
</div>

<script>
(() => {
  "use strict";

  // ---------- Configuración ----------
  const W = 600, H = 150;
  const GROUND_Y = 131;          // línea del suelo
  const GRAVITY = 0.6;
  const JUMP_V = -10;
  const START_SPEED = 6;
  const MAX_SPEED = 13;
  const ACCEL = 0.001;
  const FG = "#535353";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // ---------- Sprites en píxeles ----------
  const DINO_BODY = [
    "          ######## ",
    "         ## #######",
    "         ##########",
    "         ##########",
    "         #####     ",
    "         ########  ",
    "#       #####      ",
    "#      #######     ",
    "##    ######## #   ",
    "###  ##########    ",
    "##############     ",
    " ############      ",
    "  ##########       ",
    "   ########        ",
  ];
  const DINO_LEGS = {
    stand: ["    ###  ##", "    ##    #", "    #     #", "    ##    ##"],
    runA:  ["    ###  ##", "    ##    #", "    ##    #", "          ##"],
    runB:  ["    ###  ##", "    ##    #", "    #    ##", "    ##     "],
  };
  const DINO_DUCK = [
    "                    ######## ",
    "#        ########## ## ######",
    "##    ###################### ",
    "############################ ",
    " ###################  ####   ",
    "  #################          ",
    "   ##############            ",
  ];
  const DUCK_LEGS = {
    runA: ["    ##  ###", "    #     #", "    ##     "],
    runB: ["    ##  ###", "    #    # ", "          #"],
  };
  const BIRD = {
    up: [
      "      #          ",
      "      ##         ",
      "   #  ###        ",
      "  ##  ####       ",
      " ###############  ",
      "#################",
      "     ###########  ",
      "       #######   ",
    ],
    down: [
      "   #             ",
      "  ##             ",
      " ################",
      "#################",
      "     ###########  ",
      "      ######     ",
      "      ####       ",
      "      ###        ",
      "      ##         ",
    ],
  };
  const PX = 2; // tamaño de cada "píxel" del sprite

  function drawSprite(rows, x, y, color = FG) {
    ctx.fillStyle = color;
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let c = 0; c < row.length; c++) {
        if (row[c] === "#") ctx.fillRect(Math.round(x + c * PX), Math.round(y + r * PX), PX, PX);
      }
    }
  }

  // ---------- Sonido (WebAudio, sin archivos) ----------
  let audio = null, muted = false;
  function beep(freq, dur, type = "square", vol = 0.05) {
    if (muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    jump: () => beep(620, 0.08),
    point: () => { beep(880, 0.08); setTimeout(() => beep(1320, 0.12), 90); },
    hit: () => { beep(180, 0.15, "sawtooth", 0.08); setTimeout(() => beep(110, 0.25, "sawtooth", 0.08), 120); },
  };

  // ---------- Récord ----------
  let highScore = 0;
  try { highScore = parseInt(localStorage.getItem("dino-hi") || "0", 10) || 0; } catch (e) {}
  function saveHigh() { try { localStorage.setItem("dino-hi", String(highScore)); } catch (e) {} }

  // ---------- Estado ----------
  let state, dino, obstacles, clouds, groundBumps, stars, speed, distance, frame,
      nextObstacleIn, flashTimer, night, nightTimer, lastMilestone, deadTimer;

  function reset() {
    state = state === undefined ? "intro" : "playing";
    dino = { x: 40, y: 0, vy: 0, ducking: false, fastFall: false, jumping: false };
    dino.y = GROUND_Y - dinoHeight();
    obstacles = [];
    clouds = [{ x: 300, y: 30 }, { x: 520, y: 55 }];
    groundBumps = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: GROUND_Y + 2 + Math.random() * 10, w: 1 + Math.random() * 3 }));
    stars = Array.from({ length: 6 }, () => ({ x: Math.random() * W, y: 10 + Math.random() * 60 }));
    speed = START_SPEED;
    distance = 0;
    frame = 0;
    nextObstacleIn = 60;
    flashTimer = 0;
    night = false; nightTimer = 0;
    lastMilestone = 0;
    deadTimer = 0;
    setNight(false);
  }

  function dinoHeight() { return dino.ducking && !dino.jumping ? DINO_DUCK.length * PX + 6 : (DINO_BODY.length + 4) * PX; }
  function dinoWidth() { return dino.ducking && !dino.jumping ? 29 * PX : 19 * PX; }
  function score() { return Math.floor(distance / 10); }

  function setNight(on) {
    night = on;
    canvas.classList.toggle("night", on);
    document.body.classList.toggle("night", on);
  }

  // ---------- Controles ----------
  function jump() {
    if (state === "intro") { state = "playing"; }
    if (state === "over") { if (deadTimer > 20) { reset(); } return; }
    if (state !== "playing") return;
    if (!dino.jumping) {
      dino.jumping = true;
      dino.ducking = false;
      dino.vy = JUMP_V - speed * 0.12;
      sfx.jump();
    }
  }
  function duck(on) {
    if (state !== "playing") return;
    dino.ducking = on;
    if (dino.jumping) dino.fastFall = on;
  }
  function togglePause() {
    if (state === "playing") state = "paused";
    else if (state === "paused") { state = "playing"; }
  }

  document.addEventListener("keydown", e => {
    if (["Space", "ArrowUp", "ArrowDown"].includes(e.code)) e.preventDefault();
    if (e.repeat && e.code !== "ArrowDown") return;
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") jump();
    else if (e.code === "ArrowDown" || e.code === "KeyS") duck(true);
    else if (e.code === "KeyP" || e.code === "Escape") togglePause();
    else if (e.code === "KeyM") muted = !muted;
    else if (e.code === "Enter" && state === "over") jump();
  });
  document.addEventListener("keyup", e => {
    if (e.code === "ArrowDown" || e.code === "KeyS") duck(false);
  });

  let touchDucking = false;
  function onPointerDown(e) {
    const rect = canvas.getBoundingClientRect();
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    const lowerHalf = y > rect.top + rect.height / 2;
    if (lowerHalf && state === "playing") { touchDucking = true; duck(true); }
    else jump();
  }
  function onPointerUp() { if (touchDucking) { touchDucking = false; duck(false); } }
  document.addEventListener("touchstart", e => { e.preventDefault(); onPointerDown(e); }, { passive: false });
  document.addEventListener("touchend", onPointerUp);
  canvas.addEventListener("mousedown", onPointerDown);
  document.addEventListener("mouseup", onPointerUp);

  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "playing") state = "paused"; });

  // ---------- Obstáculos ----------
  function spawnObstacle() {
    const s = score();
    const canBird = s > 300 && Math.random() < 0.25;
    if (canBird) {
      const heights = [GROUND_Y - 24, GROUND_Y - 40, GROUND_Y - 72];
      const y = heights[Math.floor(Math.random() * heights.length)];
      obstacles.push({ type: "bird", x: W + 20, y, w: 34, h: 18, extra: 0.8 + Math.random() * 0.6 });
    } else {
      const big = Math.random() < 0.5;
      const maxCount = speed > 9 ? 3 : speed > 7 ? 2 : 1;
      const count = 1 + Math.floor(Math.random() * maxCount);
      const cw = big ? 24 : 16, ch = big ? 48 : 34;
      obstacles.push({ type: "cactus", big, count, x: W + 20, y: GROUND_Y - ch, w: cw * count + (count - 1) * 2, h: ch, cw });
    }
    const minGap = 50 + speed * 6;
    nextObstacleIn = minGap + Math.random() * 60;
  }

  function drawCactus(o) {
    ctx.fillStyle = FG;
    for (let i = 0; i < o.count; i++) {
      const x = Math.round(o.x + i * (o.cw + 2));
      const y = o.y, h = o.h, w = o.cw;
      const tw = Math.round(w * 0.36);            // grosor del tronco
      const tx = x + Math.round((w - tw) / 2);
      // tronco con remate redondeado
      ctx.fillRect(tx + 1, y, tw - 2, 2);
      ctx.fillRect(tx, y + 2, tw, h - 2);
      // brazo izquierdo
      const armW = Math.round(w * 0.18);
      const la = y + Math.round(h * 0.25);
      ctx.fillRect(x, la, armW, Math.round(h * 0.35));
      ctx.fillRect(x, la + Math.round(h * 0.35) - armW, tx - x, armW);
      // brazo derecho
      const ra = y + Math.round(h * 0.15);
      ctx.fillRect(x + w - armW, ra, armW, Math.round(h * 0.3));
      ctx.fillRect(tx + tw, ra + Math.round(h * 0.3) - armW, x + w - armW - (tx + tw), armW);
      // espinas
      ctx.fillStyle = "#f7f7f7";
      ctx.fillRect(tx + 2, y + 8, 1, 1);
      ctx.fillRect(tx + tw - 3, y + Math.round(h * 0.6), 1, 1);
      ctx.fillStyle = FG;
    }
  }

  // ---------- Colisiones (cajas reducidas para ser justos) ----------
  function dinoBoxes() {
    const x = dino.x, y = dino.y;
    if (dino.ducking && !dino.jumping) {
      return [{ x: x + 2, y: y + 4, w: 52, h: 12 }];
    }
    return [
      { x: x + 20, y: y + 2, w: 16, h: 14 },   // cabeza
      { x: x + 4,  y: y + 16, w: 24, h: 14 },  // cuerpo
      { x: x + 10, y: y + 30, w: 12, h: 10 },  // patas
    ];
  }
  function obstacleBoxes(o) {
    if (o.type === "bird") return [{ x: o.x + 4, y: o.y + 6, w: o.w - 8, h: o.h - 10 }];
    return [{ x: o.x + 3, y: o.y + 3, w: o.w - 6, h: o.h - 3 }];
  }
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  // ---------- Actualización ----------
  function update() {
    frame++;
    if (state === "over") { deadTimer++; return; }
    if (state !== "playing") return;

    speed = Math.min(MAX_SPEED, speed + ACCEL);
    distance += speed;

    // física del dino
    if (dino.jumping) {
      dino.vy += dino.fastFall ? GRAVITY * 3 : GRAVITY;
      dino.y += dino.vy;
      const floor = GROUND_Y - (DINO_BODY.length + 4) * PX;
      if (dino.y >= floor) {
        dino.y = floor; dino.vy = 0; dino.jumping = false; dino.fastFall = false;
      }
    }
    if (!dino.jumping) dino.y = GROUND_Y - dinoHeight();

    // obstáculos
    nextObstacleIn -= speed / 6;
    if (nextObstacleIn <= 0) spawnObstacle();
    for (const o of obstacles) o.x -= o.type === "bird" ? speed * o.extra + 1 : speed;
    obstacles = obstacles.filter(o => o.x + o.w > -10);

    // nubes y suelo
    for (const c of clouds) c.x -= speed * 0.2;
    clouds = clouds.filter(c => c.x > -50);
    if (clouds.length < 4 && Math.random() < 0.006) clouds.push({ x: W + 10, y: 15 + Math.random() * 60 });
    for (const b of groundBumps) { b.x -= speed; if (b.x < -5) { b.x = W + Math.random() * 20; b.y = GROUND_Y + 2 + Math.random() * 10; } }
    for (const s of stars) { s.x -= 0.3; if (s.x < -5) { s.x = W + 5; s.y = 10 + Math.random() * 60; } }

    // puntuación
    const s = score();
    if (Math.floor(s / 100) > lastMilestone) {
      lastMilestone = Math.floor(s / 100);
      flashTimer = 60;
      sfx.point();
    }
    if (flashTimer > 0) flashTimer--;

    // día / noche
    if (s > 0 && s % 700 === 0 && !night && nightTimer === 0) { setNight(true); nightTimer = 1; }
    if (night) { nightTimer++; if (nightTimer > 900) { setNight(false); nightTimer = 0; } }

    // colisiones
    const db = dinoBoxes();
    for (const o of obstacles) {
      for (const ob of obstacleBoxes(o)) {
        if (db.some(d => hit(d, ob))) { gameOver(); return; }
      }
    }
  }

  function gameOver() {
    state = "over";
    deadTimer = 0;
    sfx.hit();
    if (navigator.vibrate) try { navigator.vibrate(120); } catch (e) {}
    const s = score();
    if (s > highScore) { highScore = s; saveHigh(); }
  }

  // ---------- Dibujo ----------
  function drawCloud(x, y) {
    ctx.fillStyle = "#dadada";
    ctx.fillRect(x + 8, y, 20, 2);
    ctx.fillRect(x + 4, y + 2, 4, 2); ctx.fillRect(x + 28, y + 2, 6, 2);
    ctx.fillRect(x, y + 4, 4, 4); ctx.fillRect(x + 34, y + 4, 8, 2);
    ctx.fillRect(x - 4, y + 8, 50, 2);
  }

  function drawDino() {
    const x = dino.x, y = dino.y;
    const running = state === "playing";
    const legFrame = Math.floor(frame / 6) % 2 === 0 ? "runA" : "runB";
    if (dino.ducking && !dino.jumping && state !== "over") {
      drawSprite(DINO_DUCK, x, y);
      drawSprite(DUCK_LEGS[legFrame], x, y + DINO_DUCK.length * PX);
      return;
    }
    drawSprite(DINO_BODY, x, y);
    const legs = !running || dino.jumping ? DINO_LEGS.stand : DINO_LEGS[legFrame];
    drawSprite(legs, x, y + DINO_BODY.length * PX);
    if (state === "over") {
      // ojo de "muerto"
      ctx.fillStyle = "#f7f7f7";
      ctx.fillRect(x + 22, y + 1, 6, 6);
      ctx.fillStyle = FG;
      ctx.fillRect(x + 22, y + 1, 2, 2); ctx.fillRect(x + 26, y + 1, 2, 2);
      ctx.fillRect(x + 24, y + 3, 2, 2);
      ctx.fillRect(x + 22, y + 5, 2, 2); ctx.fillRect(x + 26, y + 5, 2, 2);
    }
  }

  function drawGround() {
    ctx.fillStyle = FG;
    ctx.fillRect(0, GROUND_Y, W, 1);
    for (const b of groundBumps) ctx.fillRect(Math.round(b.x), Math.round(b.y), Math.round(b.w), 1);
  }

  function drawScore() {
    ctx.font = "bold 12px 'Courier New', monospace";
    ctx.textAlign = "right";
    ctx.fillStyle = FG;
    const pad = n => String(n).padStart(5, "0");
    let cur = pad(score());
    // parpadeo al alcanzar cada 100 puntos
    const blinkHidden = flashTimer > 0 && Math.floor(flashTimer / 8) % 2 === 0;
    if (flashTimer > 0) cur = pad(lastMilestone * 100);
    if (!blinkHidden) ctx.fillText(cur, W - 10, 20);
    if (highScore > 0) {
      ctx.globalAlpha = 0.7;
      ctx.fillText("HI " + pad(highScore), W - 60, 20);
      ctx.globalAlpha = 1;
    }
  }

  function drawCenterText(lines) {
    ctx.textAlign = "center";
    ctx.fillStyle = FG;
    lines.forEach(([txt, size, dy]) => {
      ctx.font = `bold ${size}px 'Courier New', monospace`;
      ctx.fillText(txt, W / 2, H / 2 + dy);
    });
  }

  function drawRestartIcon(cx, cy) {
    ctx.strokeStyle = FG; ctx.fillStyle = FG; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 10, -Math.PI * 0.35, Math.PI * 1.55); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 3, cy - 15); ctx.lineTo(cx + 11, cy - 9); ctx.lineTo(cx + 2, cy - 4);
    ctx.closePath(); ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#f7f7f7";
    ctx.fillRect(0, 0, W, H);

    if (night) {
      // luna y estrellas (se verán claras tras invertir)
      ctx.fillStyle = "#c8c8c8";
      for (const s of stars) ctx.fillRect(Math.round(s.x), Math.round(s.y), 2, 2);
      ctx.fillStyle = "#b0b0b0";
      ctx.beginPath(); ctx.arc(W - 140, 35, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f7f7f7";
      ctx.beginPath(); ctx.arc(W - 135, 32, 9, 0, Math.PI * 2); ctx.fill();
    }

    for (const c of clouds) drawCloud(Math.round(c.x), Math.round(c.y));
    drawGround();

    for (const o of obstacles) {
      if (o.type === "cactus") drawCactus(o);
      else drawSprite(Math.floor(frame / 12) % 2 ? BIRD.up : BIRD.down, o.x, o.y);
    }

    drawDino();
    drawScore();

    if (state === "intro") {
      drawCenterText([["PULSA ESPACIO O TOCA PARA EMPEZAR", 13, -10]]);
    } else if (state === "paused") {
      drawCenterText([["PAUSA", 16, -10], ["pulsa P para continuar", 11, 8]]);
    } else if (state === "over") {
      drawCenterText([["G A M E   O V E R", 16, -25]]);
      drawRestartIcon(W / 2, H / 2 + 5);
    }
  }

  // ---------- Bucle principal a paso fijo (60 Hz) ----------
  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 250);
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
